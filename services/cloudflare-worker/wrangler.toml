name = "picbind-worker"
main = "src/index.ts"
compatibility_date = "2026-04-20"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.picbind.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "METRICS_KV"
id = "ffd6a9e2ce924cf2a4b93b782d525810"

[[r2_buckets]]
binding = "SHARE_IMAGES_R2"
bucket_name = "picbind-bucket"

[[d1_databases]]
binding = "USER_DB"
database_name = "picbind-users"
database_id = "4cd774e5-14a5-43d6-a9da-167f04de7870"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "METRICS_COUNTER"
class_name = "MetricsCounter"

[[durable_objects.bindings]]
name = "WORKSPACE_REALTIME"
class_name = "WorkspaceRealtimeObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareRoomObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WeixinMessagingObject"]

[[migrations]]
tag = "v4"
deleted_classes = ["WeixinMessagingObject"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["WorkspaceRealtimeObject"]

[[migrations]]
tag = "v6"
deleted_classes = ["ShareRoomObject"]

[vars]
DEV_MODE = "0"
# QINIU_ACCESS_KEY and QINIU_SECRET_KEY must be configured with Wrangler Secret.
# QINIU_BUCKET and QINIU_UPLOAD_URL will be added when Qiniu Workspace storage is enabled.
SITE_URL = "https://picbind.com"
OAUTH_CALLBACK_ORIGIN = "https://api.picbind.com"
ALLOWED_ORIGINS = "https://picbind.com,https://www.picbind.com,http://localhost:3000,http://127.0.0.1:3000,tauri://localhost,http://tauri.localhost"

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ROUTE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "REALTIME_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
