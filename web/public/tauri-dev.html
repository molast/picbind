<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PicBind</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #eef5ff;
      }

      .loader {
        width: 34px;
        height: 34px;
        border: 3px solid #c4d8fb;
        border-top-color: #3f80ea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader" role="status" aria-label="Loading"></div>
    <script>
      const retryDelayMs = 250;

      async function waitForApplication() {
        try {
          const response = await fetch("/", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Application returned ${response.status}`);
          }

          const html = await response.text();
          const document = new DOMParser().parseFromString(html, "text/html");
          const scripts = Array.from(document.scripts)
            .map((script) => script.src)
            .filter(Boolean);

          await Promise.all(
            scripts.map(async (url) => {
              const scriptResponse = await fetch(url, { cache: "no-store" });
              if (!scriptResponse.ok) {
                throw new Error(`Script returned ${scriptResponse.status}`);
              }
            }),
          );

          window.location.replace("/");
        } catch (_error) {
          window.setTimeout(waitForApplication, retryDelayMs);
        }
      }

      waitForApplication();
    </script>
  </body>
</html>
