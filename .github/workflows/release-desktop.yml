name: Release desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version (for example 3.0.0)
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  NODE_VERSION: "22"
  PNPM_VERSION: "11.10.0"
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  RUSTUP_DIST_SERVER: https://rsproxy.cn
  RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup

jobs:
  macos-apple-silicon:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Check JavaScript environment
        run: |
          node --version
          pnpm --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: macos-apple-silicon

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Apple Silicon installer
        env:
          # GitHub macOS runners support Finder scripting. Without this override,
          # Tauri skips the custom DMG background and icon positions in CI.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          # Sign the complete app bundle without requiring a paid Developer ID.
          # This keeps the bundle structurally valid while remaining unnotarized.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          VERSION="${RELEASE_VERSION#v}"
          pnpm --dir apps/desktop exec tauri build \
            --target aarch64-apple-darwin \
            --bundles dmg \
            --config "{\"version\":\"${VERSION}\"}" \
            --ci
          DMG_DIR="target/aarch64-apple-darwin/release/bundle/dmg"
          DMG_FILES=("$DMG_DIR"/*.dmg)
          test "${#DMG_FILES[@]}" -eq 1
          test -f "${DMG_FILES[0]}"
          DMG_PATH="$DMG_DIR/PicBind-v${VERSION}-macOS-aarch64.dmg"
          # Tauri applies the app signing identity to the DMG too. Re-encoding
          # removes that outer ad-hoc signature while preserving the signed app.
          hdiutil convert "${DMG_FILES[0]}" -format UDZO -o "$DMG_PATH"
          rm "${DMG_FILES[0]}"

      - name: Verify custom DMG layout
        run: |
          VERSION="${RELEASE_VERSION#v}"
          DMG_PATH="target/aarch64-apple-darwin/release/bundle/dmg/PicBind-v${VERSION}-macOS-aarch64.dmg"
          test -f "$DMG_PATH"
          MOUNT_DIR=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          test -f "$MOUNT_DIR/.background/dmg-background.png"
          test -f "$MOUNT_DIR/.DS_Store"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_DIR/PicBind.app"
          if codesign -dv "$DMG_PATH" >/dev/null 2>&1; then
            echo "DMG must remain unsigned; only PicBind.app is ad-hoc signed."
            exit 1
          fi
          codesign -dv --verbose=4 "$MOUNT_DIR/PicBind.app" 2>&1 | grep -q 'Signature=adhoc'
          codesign -dv --verbose=4 "$MOUNT_DIR/PicBind.app" 2>&1 | grep -q 'Sealed Resources'

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicBind-macOS-Apple-Silicon
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach macOS installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true

  windows-x86-64:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Check JavaScript environment
        shell: pwsh
        run: |
          node --version
          pnpm --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-x86-64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check build environment
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          rustup show

      - name: Build x86_64 Windows installers
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          $configPath = Join-Path $env:RUNNER_TEMP "tauri-release-config.json"
          @{ version = $version } | ConvertTo-Json -Compress | Set-Content -Path $configPath -Encoding utf8
          pnpm --dir apps/desktop exec tauri build `
            --target x86_64-pc-windows-msvc `
            --bundles nsis,msi `
            --config $configPath `
            --ci
          $nsisFiles = @(Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -File)
          $msiFiles = @(Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter "*.msi" -File)
          if ($nsisFiles.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsisFiles.Count)" }
          if ($msiFiles.Count -ne 1) { throw "Expected exactly one MSI installer, found $($msiFiles.Count)" }
          Move-Item -LiteralPath $nsisFiles[0].FullName -Destination (Join-Path $nsisFiles[0].DirectoryName "PicBind-v$version-Windows-x86_64.exe")
          Move-Item -LiteralPath $msiFiles[0].FullName -Destination (Join-Path $msiFiles[0].DirectoryName "PicBind-v$version-Windows-x86_64.msi")

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PicBind-Windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach Windows installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          fail_on_unmatched_files: true
