[package]
name = "picbind-image-native"
version = "0.1.0"
edition = "2024"

[dependencies]
fontdue = "0.9.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
image-webp = "0.2.4"
imagequant = { version = "4.4.1", default-features = false }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image", "rayon"] }
lodepng = { version = "3.12.2", default-features = false, features = ["rust_backend"] }
mozjpeg-rs = "0.8.0"
oxipng = { version = "10.2.0", default-features = false, features = ["zopfli"] }
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
rgb = { version = "0.8.53", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twemoji-assets = { version = "1.5.1", default-features = false, features = ["png"] }
webp = { version = "0.3.1", default-features = false }
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
zune-jpeg = "0.5.15"
zune-jpegxl = { version = "0.5.2", default-features = false, features = ["std", "threads"] }
zune-png = "0.5.2"
zenavif = { version = "0.1.6", default-features = false }
zenpixels = { version = "0.2.16", default-features = false }
