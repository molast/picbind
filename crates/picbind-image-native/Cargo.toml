[package]
name = "picbind-image-native"
version = "0.1.0"
edition = "2024"

[features]
default = ["codecs"]
operations = ["dep:fontdue", "dep:serde", "dep:serde_json", "dep:twemoji-assets"]
avif-decoder = ["dep:zenavif", "dep:zenpixels"]
codecs = [
  "operations",
  "avif-decoder",
  "image/jpeg",
  "image/png",
  "dep:image-webp",
  "dep:imagequant",
  "dep:jxl-oxide",
  "dep:lodepng",
  "dep:mozjpeg-rs",
  "dep:oxipng",
  "dep:ravif",
  "dep:rgb",
  "dep:webp",
  "dep:zune-core",
  "dep:zune-jpeg",
  "dep:zune-jpegxl",
  "dep:zune-png",
]

[dependencies]
fontdue = { version = "0.9.3", optional = true }
image = { version = "0.25", default-features = false }
image-webp = { version = "0.2.4", optional = true }
imagequant = { version = "4.4.1", default-features = false, optional = true }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image", "rayon"], optional = true }
lodepng = { version = "3.12.2", default-features = false, features = ["rust_backend"], optional = true }
mozjpeg-rs = { version = "0.8.0", optional = true }
oxipng = { version = "10.2.0", default-features = false, features = ["zopfli"], optional = true }
ravif = { version = "0.13.0", default-features = false, features = ["threading"], optional = true }
rgb = { version = "0.8.53", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
twemoji-assets = { version = "1.5.1", default-features = false, features = ["png"], optional = true }
webp = { version = "0.3.1", default-features = false, optional = true }
zune-core = { version = "0.5.3", default-features = false, features = ["std"], optional = true }
zune-jpeg = { version = "0.5.15", optional = true }
zune-jpegxl = { version = "0.5.2", default-features = false, features = ["std", "threads"], optional = true }
zune-png = { version = "0.5.2", optional = true }
zenavif = { version = "0.1.6", default-features = false, optional = true }
zenpixels = { version = "0.2.16", default-features = false, optional = true }
