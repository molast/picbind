[package]
name = "image_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
picbind-image-native = { path = "../picbind-image-native", default-features = false, features = ["operations", "avif-decoder"] }
mozjpeg-rs = "0.8.0"
lodepng = { version = "3.12.2", default-features = false, features = ["rust_backend"] }
imagequant = { version = "4.4.1", default-features = false }
imgico = "0.1.3"
oxipng = { version = "=2.3.0", default-features = false }
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
