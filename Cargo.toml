[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/picbind-core",
  "crates/picbind-image",
  "crates/picbind-image-native",
  "crates/picbind-network",
  "crates/picbind-perceptual",
  "crates/picbind-protocol",
  "crates/picbind-storage",
]

# Image codecs process full pixel buffers and are unusably slow at opt-level 0.
# Keep application crates in the normal debuggable dev profile while compiling
# third-party dependencies and the native image pipeline with runtime optimizations.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.picbind-image-native]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release.package.image_wasm]
opt-level = "s"

[profile.release.package.perceptual_wasm]
opt-level = 3
