[package]
name = "image_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
mozjpeg-rs = "0.8.0"
lodepng = "3.12.2"
imagequant = { version = "4.4.1", default-features = false }
ravif = { version = "0.13", default-features = false }
imgico = "0.1.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"  # 优化Wasm大小
lto = true       # 链接时优化
