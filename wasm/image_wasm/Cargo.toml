[package]
name = "image_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
mozjpeg-rs = "0.8.0"
lodepng = { version = "3.12.2", default-features = false, features = ["rust_backend"] }
imagequant = { version = "4.4.1", default-features = false }
imgico = "0.1.3"
crc32fast = "1.5"
miniz_oxide = "0.8"
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"  # 优化Wasm大小
lto = true       # 链接时优化

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
