[package]
name = "image_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wee_alloc = "0.4"
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"  # 优化Wasm大小
lto = true       # 链接时优化