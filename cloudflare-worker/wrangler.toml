name = "picbind-worker"
main = "src/index.ts"
compatibility_date = "2026-04-20"

routes = [
  { pattern = "api.picbind.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "METRICS_KV"
id = "ffd6a9e2ce924cf2a4b93b782d525810"

[[durable_objects.bindings]]
name = "METRICS_COUNTER"
class_name = "MetricsCounter"

[[durable_objects.bindings]]
name = "REALTIME_ROOMS"
class_name = "ShareRoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareRoomObject"]

[vars]
SITE_URL = "https://picbind.com"
ALLOWED_ORIGINS = "https://picbind.com"

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ROUTE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[env.preview.vars]
SITE_URL = "https://preview.picbind.pages.dev"
ALLOWED_ORIGINS = "*"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
