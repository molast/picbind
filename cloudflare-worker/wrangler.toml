name = "picbind-worker"
main = "src/index.ts"
compatibility_date = "2026-04-20"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.picbind.com", custom_domain = true }
]

[[kv_namespaces]]
binding = "METRICS_KV"
id = "ffd6a9e2ce924cf2a4b93b782d525810"

[[r2_buckets]]
binding = "SHARE_IMAGES_R2"
bucket_name = "picbind-bucket"

[[r2_buckets]]
binding = "MESSAGING_MEDIA_R2"
bucket_name = "picbind-bucket"

[[durable_objects.bindings]]
name = "METRICS_COUNTER"
class_name = "MetricsCounter"

[[durable_objects.bindings]]
name = "REALTIME_ROOMS"
class_name = "ShareRoomObject"

[[durable_objects.bindings]]
name = "WEIXIN_MESSAGING"
class_name = "WeixinMessagingObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareRoomObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WeixinMessagingObject"]

[vars]
WORKER_VERSION = "3.0.0"
DEV_MODE = "0"
ADMIN_KEY = "64b5cdf2a1f5b998c54a045fb4f89006efb41513e94d16712bdb167a016010fc"
# Options: "p2p" forces WebRTC DataChannel, "r2" forces R2 transfer,
# and "auto" uses R2 when RTT exceeds R2_RTT_THRESHOLD_MS, otherwise P2P.
FILE_TRANSFER_MODE = "auto"
MAX_IMAGE_TRANSFER_SIZE_MB = "10"
R2_RTT_THRESHOLD_MS = "200"
R2_FILE_TTL_SECONDS = "1800"
MESSAGING_MEDIA_TTL_SECONDS = "1800"
MESSAGING_MEDIA_URL_TTL_SECONDS = "900"
MESSAGING_MAX_MEDIA_SIZE_MB = "20"
MESSAGING_PUBLIC_URL = "https://api.picbind.com"
R2_BUCKET_NAME = "picbind-bucket"
R2_ACCOUNT_ID = "a3af9fe482ea605e4cc8b2496a45b806"
# QINIU_ACCESS_KEY and QINIU_SECRET_KEY must be configured with Wrangler Secret.
# QINIU_BUCKET and QINIU_UPLOAD_URL will be added when Qiniu room storage is enabled.
SITE_URL = "https://picbind.com"
# Optional standalone @picbind/room deployment origin. Defaults to SITE_URL.
# ROOM_URL = "https://room.picbind.com"
ALLOWED_ORIGINS = "https://picbind.com,https://www.picbind.com,https://room.picbind.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4174,http://127.0.0.1:4174"
TURN_TOKEN_ID = "b7372f7025974b852a03b856a4c3461f"

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ROUTE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
